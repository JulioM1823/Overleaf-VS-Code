name: Temporary Linux filename proof
permissions:
  contents: read
on:
  push:
    branches: [codex/release-platform-audit-2026-11-19]
    paths: [.github/workflows/audit-filename-proof.yml]
jobs:
  proof:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe native filename limits without changing product data
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path'),{randomUUID}=require('node:crypto');
          const root=fs.mkdtempSync(path.join(os.tmpdir(),'orbitleaf-filename-proof-'));
          const names={original:'漢'.repeat(80)+'.tex',recovery:'漢'.repeat(80)+'.recovery-'+randomUUID()+'.tex'};
          const result={platform:process.platform,arch:process.arch,node:process.version,observations:{}};
          try { for (const [kind,name] of Object.entries(names)) {
            const item={utf8Bytes:Buffer.byteLength(name),utf16Units:name.length};
            try {fs.writeFileSync(path.join(root,name),'synthetic fixture',{flag:'wx'});item.created=true;}
            catch(e){item.created=false;item.errorCode=e.code;}
            result.observations[kind]=item;
          }} finally {fs.rmSync(root,{recursive:true,force:true});}
          console.log('FILENAME_PROOF '+JSON.stringify(result));
          NODE
