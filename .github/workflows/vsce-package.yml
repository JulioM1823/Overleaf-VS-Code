name: Check and package extension
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm ci --prefix views/chat-view
      - run: npm test
      - run: npx --yes @vscode/vsce@4.1.0 package --out orbitleaf.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: orbitleaf-vsix
          path: orbitleaf.vsix
